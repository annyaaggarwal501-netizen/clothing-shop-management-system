spring.application.name=csms
server.port=${PORT:8080}

# ---- Database (MySQL 8). Secrets come from environment variables (REQ-SEC-4). ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clothing_shop}?createDatabaseIfNotExist=true&connectionTimeZone=%2B05:30&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:csms}
spring.datasource.password=${DB_PASSWORD:csms_dev_pw}

# Flyway owns the schema: V1 (tables), V2 (seed data), V3 (prototype additions).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Product import files: the app itself rejects files over 5 MB with ERR-PRD-001 (REQ-PRD-5).
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# ---- Session cookie (REQ-ACC-2): HttpOnly, SameSite=Strict, 30 min inactivity ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Set to true when you run behind HTTPS (REQ-SEC-1).
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Shop details printed on receipts ----
csms.shop.name=Mansi Collection
csms.shop.address=Main Bazaar, Kotputli, Rajasthan
csms.shop.gstin=08ABCDE1234F1Z5
csms.shop.phone=9000000000
csms.shop.location-url=https://maps.google.com/?q=Mansi+Collection+Kotputli

# ---- Business rules (data-driven, REQ-MNT-4) ----
csms.rules.staff-discount-limit-percent=10
csms.rules.return-window-days=7
csms.rules.credit-note-validity-days=90
csms.rules.points-per-100=1

# ---- WhatsApp (Click-to-Chat mode only in the prototype) ----
# Public base URL used inside e-bill links. Leave blank to use the address the browser used.
# For a phone to open the link, use the laptop's Wi-Fi IP (e.g. http://192.168.1.20:8080) or a tunnel URL.
csms.public-base-url=${PUBLIC_BASE_URL:}
# Secret used to sign e-bill links so they cannot be guessed. CHANGE for any real use.
csms.link-secret=${LINK_SECRET:dev-only-change-me-7f3a9c}

logging.level.org.hibernate.SQL=warn
